name: cmdtab
options:
  bundleIdPrefix: com.cmdtab
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  cmdtab:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Sources
      - path: Resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmdtab.app
        PRODUCT_NAME: cmdtab
        INFOPLIST_FILE: App/Info.plist
        LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    entitlements:
      path: App/cmdtab.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true

  cmdtabTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/cmdtabTests
    dependencies:
      - target: cmdtab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmdtab.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  cmdtab:
    build:
      targets:
        cmdtab: all
        cmdtabTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - cmdtabTests
    archive:
      config: Release
